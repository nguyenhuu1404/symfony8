memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 60

; Opcache - tắt cache trong dev để thấy thay đổi code ngay
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Hiển thị lỗi rõ ràng khi dev (nhớ tắt ở production)
display_errors = On
error_reporting = E_ALL
